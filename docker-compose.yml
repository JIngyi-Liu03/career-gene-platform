# Career Gene Platform —— 全新后端部署（与旧站 server.js:80 完全隔离）
#
# 隔离要点：
#  - 对外端口 8080（用户站）/ 8081（管理后台），旧站独占 80，物理不冲突
#  - 独立 docker 网络 career-net，db/api 不映射宿主机端口
#  - 独立数据卷 pgdata，与旧站 records.json 无关
#  - 用户站 nginx(8080) 与 管理后台 nginx(8081) 分别反代 /api → api:3000
#
# 敏感信息（DB 密码 / JWT 密钥 / 管理员密码）由同目录 .env 注入（见 .env.example），不写死进本文件。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: career_gene
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career -d career_gene"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - career-net

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中设置 DATABASE_URL}
      PORT: "3000"
      ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET:?请在 .env 中设置 ACCESS_JWT_SECRET}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?请在 .env 中设置 REFRESH_JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?请在 .env 中设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - career-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"   # 对外访问地址：http://<服务器IP>:8080
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - career-net

  # 管理后台（独立端口 8081，隔离于用户站）
  admin-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"   # 管理后台：http://<服务器IP>:8081
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin/dist:/usr/share/nginx/admin:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - career-net

volumes:
  pgdata:

networks:
  career-net:
    driver: bridge
