server {
    listen 80;
    server_name empowerdf.com;

    root /usr/share/nginx/admin;
    index index.html;

    client_max_body_size 10m;

    # 安全响应头：纵深防御 XSS / 点击劫持 / MIME 嗅探 / 信息泄露。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # 前端 SPA：未知路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：剥离 /api 前缀后转发到 NestJS(容器内 3000)
    #   请求 /api/xxx  ->  http://api:3000/xxx
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
